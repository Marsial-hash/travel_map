[project]
name = "state-support-etf-system"
version = "0.1.0"
description = "A股国家队ETF资金追踪、介入预测与低位择时系统 — Phase 0A/0B 数据可行性验证"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "polars>=1.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "tushare>=1.4.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: 离线单元测试（无网络/无真实接口）",
    "integration: 离线集成测试（含日历/时间/版本/份额差分/物化保护）",
    "live: 真实数据源集成测试",
    "network: 依赖外部网络的测试",
    "requires_tushare_token: 需要 TUSHARE_TOKEN 的 Tushare 测试",
    "requires_free_source_access: 需要免费公开源访问的测试",
    "requires_commercial_subscription: 需要商业订阅的测试",
]
addopts = "-m 'not live and not network'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # 测试/代码中 assert 断言是正常用法

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S108", "S110"]  # 测试允许临时文件与 try-except

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "registry"]
